<script>/* Engine: logic thuần (không DOM) cho mini game 5 A.M TEAM - Random Women's Doubles.
 * Dùng được cả trong trình duyệt (window.PBEngine) và Node (require) để test. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PBEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- Trọng số penalty: Fairness > Không trùng partner > Không trùng đối thủ > Random ----------
  var W = {
    BYE_COUNT: 1000000,        // mỗi lần đã nghỉ trước đó của người bị chọn nghỉ lượt này
    BYE_CONSECUTIVE: 300000,   // nghỉ liên tiếp
    PARTNER_REPEAT: 1000,      // nhân với (số lần đã ghép)^2
    PARTNER_LAST_ROUND: 5000,  // vừa ghép ở lượt ngay trước
    OPPONENT_REPEAT: 10        // mỗi lần đã gặp làm đối thủ
  };

  function combinations(arr, k) {
    var out = [];
    (function rec(start, cur) {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (var i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    })(0, []);
    return out;
  }

  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function key(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  /** Số người nghỉ mỗi lượt: phần dư khi chia 4 (mỗi trận cần 4 người). */
  function byesPerRound(n) { return n % 4; }

  /** Thống kê lịch sử từ các lượt đã có: partner/đối thủ/nghỉ/số trận đã xếp. */
  function buildHistory(playerIds, rounds) {
    var partner = {}, opp = {}, byes = {}, games = {}, lastBye = {}, lastPartner = {};
    playerIds.forEach(function (id) { byes[id] = 0; games[id] = 0; });
    rounds.forEach(function (r, idx) {
      var isLast = idx === rounds.length - 1;
      (r.byes || []).forEach(function (id) { byes[id] = (byes[id] || 0) + 1; if (isLast) lastBye[id] = true; });
      (r.matches || []).forEach(function (m) {
        m.pairA.concat(m.pairB).forEach(function (id) { games[id] = (games[id] || 0) + 1; });
        [m.pairA, m.pairB].forEach(function (p) {
          var k = key(p[0], p[1]);
          partner[k] = (partner[k] || 0) + 1;
          if (isLast) lastPartner[k] = true;
        });
        m.pairA.forEach(function (a) { m.pairB.forEach(function (b) {
          var k = key(a, b); opp[k] = (opp[k] || 0) + 1;
        }); });
      });
    });
    return { partner: partner, opp: opp, byes: byes, games: games, lastBye: lastBye, lastPartner: lastPartner };
  }

  /**
   * Tạo một lượt mới.
   * @param playerIds  mảng id người chơi (4..12 khuyến nghị)
   * @param prevRounds các lượt trước (KHÔNG gồm lượt nháp đang random lại)
   * @param rng        hàm random [0,1) (mặc định Math.random) để test có seed
   * @returns {byes:[id], pairs:[[a,b]], matches:[{pairA,pairB}], cost}
   */
  function generateRound(playerIds, prevRounds, rng) {
    rng = rng || Math.random;
    var n = playerIds.length;
    if (n < 4) throw new Error('Cần ít nhất 4 người chơi');
    var h = buildHistory(playerIds, prevRounds || []);
    var b = byesPerRound(n);
    var bestCost = Infinity, ties = 0, best = null;

    function consider(cost, byeSet, pairs) {
      if (cost < bestCost) { bestCost = cost; ties = 1; best = { byes: byeSet, pairs: pairs.slice() }; }
      else if (cost === bestCost) { ties++; if (rng() < 1 / ties) best = { byes: byeSet, pairs: pairs.slice() }; }
    }

    function pairCost(x, y) {
      var k = key(x, y), c = h.partner[k] || 0;
      return W.PARTNER_REPEAT * c * c + (h.lastPartner[k] ? W.PARTNER_LAST_ROUND : 0);
    }

    var byeSets = b === 0 ? [[]] : combinations(playerIds, b);
    byeSets.forEach(function (byeSet) {
      var byeCost = 0;
      byeSet.forEach(function (id) {
        byeCost += W.BYE_COUNT * h.byes[id] + (h.lastBye[id] ? W.BYE_CONSECUTIVE : 0);
      });
      if (byeCost > bestCost) return;
      var active = playerIds.filter(function (id) { return byeSet.indexOf(id) < 0; });
      var used = new Array(active.length), cur = [];
      (function rec(cost) {
        if (cost > bestCost) return;
        var i = 0; while (i < active.length && used[i]) i++;
        if (i === active.length) { consider(cost, byeSet, cur); return; }
        used[i] = true;
        for (var j = i + 1; j < active.length; j++) {
          if (used[j]) continue;
          used[j] = true; cur.push([active[i], active[j]]);
          rec(cost + pairCost(active[i], active[j]));
          cur.pop(); used[j] = false;
        }
        used[i] = false;
      })(byeCost);
    });

    // Ghép các cặp thành trận: giảm số lần gặp lại cùng đối thủ
    var pairs = shuffle(best.pairs, rng);
    var matches = arrangeMatches(pairs, h, rng);
    return { byes: best.byes.slice(), pairs: pairs, matches: matches, cost: bestCost };
  }

  function arrangeMatches(pairs, h, rng) {
    function oppCost(p, q) {
      var c = 0;
      p.forEach(function (a) { q.forEach(function (b) { c += (h.opp[key(a, b)] || 0) * W.OPPONENT_REPEAT; }); });
      return c;
    }
    var best = Infinity, ties = 0, chosen = null;
    var used = new Array(pairs.length), cur = [];
    (function rec(cost) {
      if (cost > best) return;
      var i = 0; while (i < pairs.length && used[i]) i++;
      if (i === pairs.length) {
        if (cost < best) { best = cost; ties = 1; chosen = cur.slice(); }
        else { ties++; if (rng() < 1 / ties) chosen = cur.slice(); }
        return;
      }
      used[i] = true;
      for (var j = i + 1; j < pairs.length; j++) {
        if (used[j]) continue;
        used[j] = true; cur.push([pairs[i], pairs[j]]);
        rec(cost + oppCost(pairs[i], pairs[j]));
        cur.pop(); used[j] = false;
      }
      used[i] = false;
    })(0);
    return shuffle(chosen || [], rng).map(function (m) { return { pairA: m[0].slice(), pairB: m[1].slice() }; });
  }

  // ---------- Thống kê & xếp hạng (luôn tính lại từ đầu: sửa tỷ số không bị cộng dồn) ----------
  function completedMatches(rounds) {
    var out = [];
    rounds.forEach(function (r) {
      if (r.status === 'draft') return;
      r.matches.forEach(function (m) {
        if (m.status === 'completed' && isFinite(m.scoreA) && isFinite(m.scoreB) && m.scoreA !== null && m.scoreB !== null) out.push(m);
      });
    });
    return out;
  }

  function computeStandings(players, rounds) {
    var rows = {};
    players.forEach(function (p) {
      rows[p.id] = { id: p.id, name: p.name, tie: p.tie || 0, played: 0, wins: 0, losses: 0, points: 0, pf: 0, pa: 0, diff: 0, byes: 0, tieBreak: null };
    });
    var ms = completedMatches(rounds);
    ms.forEach(function (m) {
      var aWin = m.scoreA > m.scoreB;
      m.pairA.forEach(function (id) { apply(rows[id], m.scoreA, m.scoreB, aWin); });
      m.pairB.forEach(function (id) { apply(rows[id], m.scoreB, m.scoreA, !aWin); });
    });
    function apply(r, pf, pa, win) {
      if (!r) return;
      r.played++; r.pf += pf; r.pa += pa; r.diff = r.pf - r.pa;
      if (win) { r.wins++; r.points++; } else r.losses++;
    }
    rounds.forEach(function (r) {
      if (r.status === 'draft') return;
      (r.byes || []).forEach(function (id) { if (rows[id]) rows[id].byes++; });
    });

    var list = Object.keys(rows).map(function (k) { return rows[k]; });
    list.sort(function (a, b) { return b.points - a.points || b.diff - a.diff || b.pf - a.pf; });

    // Nhóm bằng nhau cả 3 tiêu chí đầu -> head-to-head -> bốc thăm
    var result = [], i = 0;
    while (i < list.length) {
      var j = i + 1;
      while (j < list.length && same(list[i], list[j])) j++;
      var group = list.slice(i, j);
      if (group.length > 1) {
        var h2h = headToHead(group, ms);
        group.forEach(function (g) { g._h2h = h2h[g.id]; });
        group.sort(function (a, b) { return b._h2h - a._h2h || a.tie - b.tie; });
        if (group[0].played > 0 || group.some(function (g) { return g.played > 0; })) {
          group.forEach(function (g) {
            var clash = group.some(function (o) { return o !== g && o._h2h === g._h2h; });
            g.tieBreak = clash ? 'draw' : 'h2h';
          });
        }
        group.forEach(function (g) { delete g._h2h; });
      }
      result = result.concat(group);
      i = j;
    }
    result.forEach(function (r, idx) { r.rank = idx + 1; });
    return result;
    function same(a, b) { return a.points === b.points && a.diff === b.diff && a.pf === b.pf; }
  }

  /** H2H: hiệu (thắng - thua) trong các trận mà 2 người trong nhóm đứng hai phía đối đầu. */
  function headToHead(group, matches) {
    var ids = {}; group.forEach(function (g) { ids[g.id] = 0; });
    matches.forEach(function (m) {
      var aWin = m.scoreA > m.scoreB;
      group.forEach(function (g) {
        var inA = m.pairA.indexOf(g.id) >= 0, inB = m.pairB.indexOf(g.id) >= 0;
        if (!inA && !inB) return;
        var oppSide = inA ? m.pairB : m.pairA;
        var faced = group.filter(function (o) { return o.id !== g.id && oppSide.indexOf(o.id) >= 0; }).length;
        if (!faced) return;
        var win = inA ? aWin : !aWin;
        ids[g.id] += (win ? 1 : -1) * faced;
      });
    });
    return ids;
  }

  /** Lịch sử partner từng người: {id: [{partner, round}]} */
  function partnerHistory(players, rounds) {
    var out = {};
    players.forEach(function (p) { out[p.id] = []; });
    rounds.forEach(function (r) {
      r.matches.forEach(function (m) {
        [m.pairA, m.pairB].forEach(function (p) {
          if (out[p[0]]) out[p[0]].push({ partner: p[1], round: r.n });
          if (out[p[1]]) out[p[1]].push({ partner: p[0], round: r.n });
        });
      });
    });
    return out;
  }

  /** Kiểm tra dữ liệu import có đúng cấu trúc tối thiểu. */
  function validateState(s) {
    if (!s || typeof s !== 'object') return 'Dữ liệu không hợp lệ';
    if (['setup', 'in_progress', 'completed'].indexOf(s.status) < 0) return 'Thiếu trạng thái giải';
    if (!Array.isArray(s.players) || s.players.length < 4 || s.players.length > 12) return 'Danh sách người chơi phải từ 4 đến 12 người';
    if (!Array.isArray(s.rounds)) return 'Thiếu danh sách lượt';
    var ids = {};
    for (var i = 0; i < s.players.length; i++) {
      var p = s.players[i];
      if (!p || !p.id || typeof p.name !== 'string') return 'Người chơi thứ ' + (i + 1) + ' không hợp lệ';
      ids[p.id] = true;
    }
    for (var r = 0; r < s.rounds.length; r++) {
      var rd = s.rounds[r];
      if (!rd || !Array.isArray(rd.matches) || !Array.isArray(rd.byes)) return 'Lượt ' + (r + 1) + ' không hợp lệ';
      for (var m = 0; m < rd.matches.length; m++) {
        var mt = rd.matches[m];
        var all = (mt.pairA || []).concat(mt.pairB || []);
        if (all.length !== 4 || all.some(function (id) { return !ids[id]; })) return 'Trận ' + (m + 1) + ' của lượt ' + (r + 1) + ' không hợp lệ';
      }
    }
    return null;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  return {
    W: W, byesPerRound: byesPerRound, buildHistory: buildHistory, generateRound: generateRound,
    computeStandings: computeStandings, partnerHistory: partnerHistory, validateState: validateState,
    completedMatches: completedMatches, mulberry32: mulberry32
  };
});
</script>

 ${d.teams.map((t,ti)=>`<div class="card mt"><div class=row><input data-ch=tn data-t=${ti} value="${esc(t.name)}"><b>${t.players.length} người</b></div><div class="pick mt" style="max-height:200px;overflow:auto">${S.members.map(m=>{const u=used(m.id);return `<label><input type=checkbox data-ch=tp data-t=${ti} value="${m.id}" ${u==ti?'checked':''} ${u>=0&&u!=ti?'disabled':''}><span class="${m.g=='F'?'f':'m'}">${esc(m.name)}</span></label>`}).join('')}</div></div>`).join('')}
 <div class="row mt"><b>Số game mỗi cặp Team:</b><select data-ch=ng>${[1,2,3,4,5,6,7,8].map(n=>`<option ${d.games.length==n?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class=mt>${d.games.map((g,gi)=>`<div class=row style="margin-bottom:6px"><b>Game ${String(gi+1).padStart(2,'0')}</b><select data-ch=gf data-g=${gi}>${Object.entries(FM).filter(([k])=>k!='s').map(([k,v])=>`<option value=${k} ${g==k?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div>
 <div class="mute">Các Team sẽ đấu vòng tròn; mỗi cặp Team đánh đủ các game trên. Chọn người đánh từng game sau khi tạo giải. Game Đánh nối / Đánh WC chỉ nhập tỷ số giữa hai Team, không cần chọn người và không tính vào điểm trình cá nhân.</div>
 <div class="row mt"><button class=b data-act=create data-k=${kind}>Tạo</button><button class="b alt" data-act=back>Huỷ</button></div>${ui.err?`<div class="neg mt">${ui.err}</div>`:''}</div>`}
function grow(m,ri,mi,e,M){const sl=SL[m.fmt],T=e.teams,r=e.rounds[ri];
 const side=(p,team,sd)=>sl.map((g,k)=>`<select data-ch=gp data-r=${ri} data-m=${mi} data-side=${sd} data-k=${k}><option value="">${g=='M'?'Nam':g=='F'?'Nữ':'Chọn người'}…</option>${T[team].players.filter(i=>M[i]&&(!g||M[i].g==g)).map(i=>`<option value="${i}" ${p[k]==i?'selected':''}>${esc(M[i].name)}</option>`).join('')}</select>`).join('');
 return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>Game ${String(mi+1).padStart(2,'0')}</b> <span class=chip>${FM[m.fmt]}</span><div class=match><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${sl.length?side(m.pairA,r.tie[0],'a'):'<b>'+esc(T[r.tie[0]].name)+'</b>'}</div><div class=row style="flex-wrap:nowrap"><input class=sc type=number min=0 max=99 value="${m.sa??''}" data-ch=sc data-r=${ri} data-m=${mi} data-s=sa>–<input class=sc type=number min=0 max=99 value="${m.sb??''}" data-ch=sc data-r=${ri} data-m=${mi} data-s=sb></div><div style="display:flex;flex-direction:column;gap:4px">${sl.length?side(m.pairB,r.tie[1],'b'):'<b>'+esc(T[r.tie[1]].name)+'</b>'}</div></div></div>`}
function teamRank(e){const T=e.teams.map(t=>({n:t.name,tw:0,gw:0,gl:0,pf:0}));
 e.rounds.forEach(r=>{let a=0,b=0;const A=T[r.tie[0]],B=T[r.tie[1]];r.matches.forEach(m=>{if(m.sa==null||m.sb==null||m.sa===m.sb)return;A.pf+=m.sa-m.sb;B.pf+=m.sb-m.sa;if(m.sa>m.sb){a++;A.gw++;B.gl++}else{b++;B.gw++;A.gl++}});if(a>b)A.tw++;else if(b>a)B.tw++});
 T.sort((x,y)=>y.tw-x.tw||y.gw-x.gw||y.pf-x.pf);
 return `<div class=card><h3>Xếp hạng Team</h3><table><tr><th>#</th><th>Team</th><th class=n>Thắng cặp</th><th class=n>Game</th><th class=n>Hiệu số</th></tr>${T.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.n)}</b></td><td class=n>${x.tw}</td><td class=n>${x.gw}-${x.gl}</td><td class=n>${x.pf>0?'+':''}${x.pf}</td></tr>`).join('')}</table></div>`}
function form0(kind){const d=ui.draft,T=TYPES[kind],gF=d.type=='rrF'?'F':d.type=='rrM'?'M':null,L=S.members.filter(m=>!gF||m.g==gF);
 return `<div class=card><h3>${kind=='mini'?'Mini game mới':'Giải đấu mới'}</h3><div class=row><input data-ch=dn placeholder="Tên (VD: Mini game 01/11)" value="${esc(d.name)}"><input type=date data-ch=dd value="${d.date}"><select data-ch=dt>${Object.entries(T).map(([k,v])=>`<option value=${k} ${d.type==k?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="row mt"><b>Người tham gia: ${d.sel.length}</b><button class="b alt" data-act=all>Chọn tất cả</button><button class="b alt" data-act=none>Bỏ chọn</button></div><div class="pick mt">${L.map(m=>`<label><input type=checkbox data-ch=pk value="${m.id}" ${d.sel.includes(m.id)?'checked':''}><span class="${m.g=='F'?'f':'m'}">${esc(m.name)}</span></label>`).join('')}</div>
 <div class="row mt"><button class=b data-act=create data-k=${kind}>Tạo</button><button class="b alt" data-act=back>Huỷ</button></div>${ui.err?`<div class="neg mt">${ui.err}</div>`:''}</div>`}
function evs(R,kind){if(ui.ev)return evDetail(R);if(ui.draft)return form(kind);
 const L=S.events.filter(e=>e.kind==kind).sort((a,b)=>a.date<b.date?1:-1);
 return `<div class=row style="margin-top:16px"><h2 style="margin:0;flex:1">${kind=='mini'?'Mini game cuối tuần':'Giải đấu'}</h2><button class="b lime" data-act=new data-k=${kind}>+ Tạo ${kind=='mini'?'mini game':'giải đấu'}</button></div><div class="grid mt">${L.map(evCard).join('')||`<div class=mute>Chưa có ${kind=='mini'?'mini game':'giải đấu'} nào. Bấm “Tạo” để bắt đầu.</div>`}</div>`}
function mem(R){const M=S.members,sel=ui.mem&&M.find(m=>m.id==ui.mem),L=[...M].sort((a,b)=>R[b.id].d-R[a.id].d);
 const det=sel?(()=>{const x=R[sel.id],H=[...x.h].reverse(),mm=MM();return `<div class=card><div class=row><h2 style="margin:0;flex:1" class="${sel.g=='F'?'f':'m'}">${esc(sel.name)}</h2><button class="b alt" data-act=closem>Đóng</button></div><div class=mute>${sel.g=='F'?'Nữ':'Nam'} · Hội đồng chấm ${sel.tier} · Điểm ban đầu ${f2(sel.init)}</div><div class=score><div><span class=big>${f2(x.d)}</span><br><span>Trình đôi (${tierOf(sel.g,x.d)})</span></div><div><span class=big>${f2(x.s)}</span><br><span>Trình đơn (${tierOf(sel.g,x.s)})</span></div><div><span class=big>${pct(x.w,x.gp)}</span><br><span>${x.w}/${x.gp} trận thắng</span></div></div><h3>Lịch sử thi đấu</h3>${H.map(h=>`<div class=match style="grid-template-columns:auto 1fr auto"><span>${fmt(h.date)}</span><span>${esc(h.en)}: ${h.dbl?'cùng '+nm(h.with,mm)+' · ':''}gặp ${nm(h.op,mm)}</span><b class="${h.win?'pos':'neg'}">${h.a}–${h.b} (${h.d>0?'+':''}${h.d.toFixed(3)})</b></div>`).join('')||'<div class=mute>Chưa có trận nào.</div>'}</div>`})():'';
 return `<h2>Thành viên (${M.length})</h2>${det}<div class=card><h3>Thêm thành viên mới</h3><div class=row><input id=mn placeholder="Tên"><select id=mg><option value=F>Nữ</option><option value=M>Nam</option></select><select id=mt>${TIERS.map(t=>`<option${t=='B'?' selected':''}>${t}</option>`).join('')}</select><button class=b data-act=addmem>Thêm</button></div><div class="mute mt">Nhóm trình do Hội đồng chấm; điểm ban đầu = trung bình mốc của nhóm theo giới.</div>${ui.err?`<div class="neg mt">${ui.err}</div>`:''}</div>
 <div class=card style="overflow-x:auto"><table><tr><th>Tên</th><th>Nhóm</th><th class=n>Trận</th><th class=n>Thắng%</th><th class=n>Đôi</th><th class=n>Đơn</th></tr>${L.map(m=>{const x=R[m.id];return `<tr class=cl data-act=mem data-id="${m.id}"><td class="${m.g=='F'?'f':'m'}">${esc(m.name)}</td><td>${chip(m.g,x.d)}</td><td class=n>${x.gp}</td><td class=n>${pct(x.w,x.gp)}</td><td class=n>${f2(x.d)}</td><td class=n>${f2(x.s)}</td></tr>`}).join('')}</table></div>`}
function render(){const R=calc(),t=ui.tab,tabs=[['tong','Tổng quan'],['mini','Mini Game'],['giai','Giải đấu'],['tv','Thành viên']];
 $('#app').innerHTML=`<div class=hero><div class=wrap><div class=top><img src="${LOGO}" alt="Logo"><div><h1>${esc(S.team.name)}</h1><small>Quản lý thành viên · mini game · giải đấu · chấm trình</small></div>${ui.api?`<div style="margin-left:auto;text-align:right">${ui.adm?`<button class="b lime" data-act=logout>Thoát quản trị</button><div><small>${ui.sync||''}</small></div>`:'<button class="b alt" style="color:#fff;border-color:#fff6" data-act=login>Quản trị</button>'}</div>`:''}</div><nav>${tabs.map(([k,v])=>`<button class="${t==k?'on':''}" data-act=tab data-v=${k}>${v}</button>`).join('')}</nav></div></div><main>${ui.off?'<div class="card neg"><b>Chưa kết nối máy chủ dữ liệu.</b> Dữ liệu nhập ở đây chỉ lưu trên trình duyệt máy này, người khác sẽ không thấy. Mở đường dẫn /api/state trên site để kiểm tra hàm lưu dữ liệu (xem HUONG-DAN.md).</div>':''}${ui.nosave?'<div class="card neg">Trình duyệt đang chặn lưu dữ liệu: tải lại trang sẽ mất hết. Hãy xuất JSON ở tab Tổng quan thường xuyên.</div>':''}${t=='tong'?tong(R):t=='tv'?mem(R):evs(R,t)}</main>`;if(RO()){document.querySelectorAll('#app input,#app select').forEach(x=>x.disabled=true);document.querySelectorAll('#app [data-act]').forEach(x=>{if(!['tab','mem','ev','back','closem','exp','login'].includes(x.dataset.act))x.remove()})}}
const draftNew=k=>({name:'',date:today(),type:Object.keys(TYPES[k])[0],sel:[],teams:[{name:'Team A',players:[]},{name:'Team B',players:[]}],games:['dm','df','mx']});
function gen(e){const ids=e.players;try{const prev=e.rounds.map(r=>({byes:r.byes,matches:r.matches}));const g=PBEngine.generateRound(ids,prev);
 e.rounds.push({n:e.rounds.length+1,byes:g.byes,matches:g.matches.map(m=>({pairA:m.pairA,pairB:m.pairB,sa:null,sb:null}))})}catch(x){ui.err=x.message}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset,e=S.events.find(x=>x.id==ui.ev);ui.err='';
 if(a=='login'){showLogin();return}
 if(a=='logout'){ui.adm=false;ui.pw='';ui.sync='';try{sessionStorage.removeItem(PWK)}catch(e){}pull();return}
 if(RO()&&!['tab','mem','ev','back','closem','exp'].includes(a))return;
 if(a!='delev')ui.armed=null;
 if(a=='tab'){ui.tab=d.v;ui.ev=null;ui.mem=null;ui.draft=null}
 else if(a=='mem'){ui.tab='tv';ui.mem=d.id;scrollTo(0,0)}else if(a=='closem')ui.mem=null
 else if(a=='ev'){ui.tab=ui.tab=='tong'?(S.events.find(x=>x.id==d.id).kind):ui.tab;ui.ev=+d.id}
 else if(a=='back'){ui.ev=null;ui.draft=null}
 else if(a=='new')ui.draft=draftNew(d.k)
 else if(a=='all'||a=='none'){const g=ui.draft.type=='rrF'?'F':ui.draft.type=='rrM'?'M':null;ui.draft.sel=a=='none'?[]:S.members.filter(m=>!g||m.g==g).map(m=>m.id)}
 else if(a=='create'&&ui.draft.type=='team'){const D=ui.draft,nm2=D.teams.map(t=>t.name.trim());if(!D.name.trim())ui.err='Nhập tên giải.';else if(D.teams.some(t=>t.players.length<2))ui.err='Mỗi Team cần ít nhất 2 thành viên.';else if(new Set(nm2).size<nm2.length||nm2.includes(''))ui.err='Tên Team phải khác nhau và không để trống.';else{const rounds=[];D.teams.forEach((A,i)=>D.teams.forEach((B,j)=>{if(j>i)rounds.push({n:rounds.length+1,tie:[i,j],byes:[],matches:D.games.map(f=>({fmt:f,pairA:SL[f].map(()=>''),pairB:SL[f].map(()=>''),sa:null,sb:null}))})}));const n={id:Date.now(),kind:d.k,name:D.name.trim(),date:D.date,type:'team',status:'upcoming',players:D.teams.flatMap(t=>t.players),teams:D.teams.map((t,i)=>({name:nm2[i],players:t.players})),games:D.games,rounds};S.events.push(n);ui.draft=null;ui.ev=n.id}}
 else if(a=='create'){const D=ui.draft;if(!D.name.trim())ui.err='Nhập tên hoạt động.';else if(D.sel.length<(D.type[0]=='r'?4:2))ui.err=D.type[0]=='r'?'Random Robin cần ít nhất 4 người.':'Chọn ít nhất 2 người.';
  else{const n={id:Date.now(),kind:d.k,name:D.name.trim(),date:D.date,type:D.type,status:'upcoming',players:D.sel,rounds:D.type[0]=='r'?[]:[{n:1,byes:[],matches:[]}]};S.events.push(n);ui.draft=null;ui.ev=n.id}}
 else if(a=='st'){e.status=d.v}
 else if(a=='delev'){if(ui.armed==e.id){S.events=S.events.filter(x=>x!==e);ui.ev=null;ui.armed=null}else ui.armed=e.id}
 else if(a=='rand'){const l=e.rounds[e.rounds.length-1];if(l&&l.matches.some(m=>m.sa==null||m.sb==null||m.sa===m.sb))ui.err='Nhập đủ tỷ số (không hoà) lượt trước khi random lượt mới.';else{gen(e);if(e.status=='upcoming')e.status='live'}}
 else if(a=='delround'){const l=e.rounds[e.rounds.length-1];if(l.matches.some(m=>m.sa!=null||m.sb!=null))ui.err='Lượt cuối đã có tỷ số, không thể xoá.';else e.rounds.pop()}
 else if(a=='addm'){const v=i=>$('#'+i).value,A=[v('a1'),v('a2')].filter(Boolean),B=[v('b1'),v('b2')].filter(Boolean),sa=v('sa'),sb=v('sb');
  if(!A.length||A.length!=B.length||new Set([...A,...B]).size!=A.length*2)ui.err='Mỗi bên cần cùng số người (1 hoặc 2), không trùng người.';else if(({tsingle:1,tdouble:2,mixd:2})[e.type]&&A.length!=({tsingle:1,tdouble:2,mixd:2})[e.type])ui.err='Thể thức này cần mỗi bên đúng '+({tsingle:1,tdouble:2,mixd:2})[e.type]+' người.';else{e.rounds[0].matches.push({pairA:A,pairB:B,sa:sa===''?null:+sa,sb:sb===''?null:+sb});if(e.status=='upcoming')e.status='live'}}
 else if(a=='delm')e.rounds[+d.r].matches.splice(+d.m,1)
 else if(a=='addmem'){const n=$('#mn').value.trim(),g=$('#mg').value,t=$('#mt').value;if(!n)ui.err='Nhập tên thành viên.';else if(S.members.some(m=>m.name.toLowerCase()==n.toLowerCase()))ui.err='Tên đã tồn tại, thêm ghi chú để phân biệt.';else S.members.push({id:'m'+Date.now(),name:n,g,tier:t,init:initOf(g,t)})}
 else if(a=='exp'){ui.io=JSON.stringify(S)}
 else if(a=='imp'){try{const j=JSON.parse($('#io').value);if(!j.members||!j.events)throw 0;S=j;ui.io=''}catch(x){ui.err='Dữ liệu không hợp lệ.'}}
 save();render();if(ui.err&&a!='addmem')alert(ui.err)});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.ch!='sc'||RO())return;const e=S.events.find(x=>x.id==ui.ev),m=e.rounds[+t.dataset.r].matches[+t.dataset.m];m[t.dataset.s]=t.value===''?null:Math.max(0,Math.min(99,+t.value));if(e.status=='upcoming')e.status='live';save()});
document.addEventListener('change',ev=>{const t=ev.target,c=t.dataset.ch;if(!c||RO())return;const D=ui.draft,e=S.events.find(x=>x.id==ui.ev);
 if(c=='dn')D.name=t.value;else if(c=='dd')D.date=t.value;else if(c=='dt'){D.type=t.value;D.sel=[]}
 else if(c=='pk'){D.sel=t.checked?[...D.sel,t.value]:D.sel.filter(x=>x!=t.value);}
 else if(c=='nt'){const n=+t.value;while(D.teams.length<n)D.teams.push({name:'Team '+String.fromCharCode(65+D.teams.length),players:[]});D.teams.length=n}
 else if(c=='tn')D.teams[+t.dataset.t].name=t.value
 else if(c=='tp'){const T=D.teams[+t.dataset.t];T.players=t.checked?[...T.players,t.value]:T.players.filter(x=>x!=t.value)}
 else if(c=='ng'){const n=+t.value;while(D.games.length<n)D.games.push('dm');D.games.length=n}
 else if(c=='gf')D.games[+t.dataset.g]=t.value
 else if(c=='gp'){const m=e.rounds[+t.dataset.r].matches[+t.dataset.m],p=t.dataset.side=='a'?m.pairA:m.pairB;if(!t.value||![...m.pairA,...m.pairB].includes(t.value))p[+t.dataset.k]=t.value;if(e.status=='upcoming')e.status='live'}
 else if(c=='sc'){const m=e.rounds[+t.dataset.r].matches[+t.dataset.m];m[t.dataset.s]=t.value===''?null:Math.max(0,Math.min(99,+t.value));if(e.status=='upcoming')e.status='live'}
 save();render()});
save();render();pull().then(async()=>{let p='';try{p=sessionStorage.getItem(PWK)||''}catch(e){}if(p&&ui.api){if(await chk(p)=='ok')await enter(p);else{try{sessionStorage.removeItem(PWK)}catch(e){}}}});setInterval(()=>{if(RO())pull()},60000);
</script></body></html>
